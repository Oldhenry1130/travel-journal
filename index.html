<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#183f3b">
<meta name="description" content="輸入分享 PIN，開啟旅行手帳。">
<title>旅行手帳｜輸入 PIN</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="gate.css"><script src="gate.js" defer></script>
</head>
<body>
<main class="entry">
 <div class="monogram" aria-hidden="true">旅</div>
 <p class="eyebrow">A JOURNEY, JUST FOR US</p>
 <h1>輸入 PIN，<br>一起出發！</h1>
 <p class="intro">輸入分享 PIN，開啟這份旅行手帳。</p>
 <form id="unlock-form">
  <label for="pin">4 位數 PIN 碼</label>
  <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required aria-describedby="status" autofocus>
  <button id="unlock" type="submit">開啟旅行手帳 <span aria-hidden="true">→</span></button>
  <p id="status" role="status" aria-live="polite"></p>
 </form>
 <p class="hint">重新整理後需再次輸入 PIN。<br>請向分享者取得 PIN 碼。</p>
 <noscript><p>請啟用瀏覽器 JavaScript 後再開啟手帳。</p></noscript>
</main>
<footer>TRAVEL JOURNAL <span>每一段旅行，都值得好好收藏。</span></footer>
</body></html>
